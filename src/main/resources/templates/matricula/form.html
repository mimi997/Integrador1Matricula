<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Matrícula')}"></head>
<body>

<style>
    .curso-card{border:1.5px solid var(--utp-border);border-radius:10px;padding:16px;transition:.2s;position:relative;background:#fff;}
    .curso-card.selected{border-color:var(--utp-blue);background:var(--utp-light);}
    .curso-card.blocked{opacity:.5;cursor:not-allowed;background:#fafafa;}
    .check-circle{width:22px;height:22px;border-radius:50%;border:2px solid var(--utp-border);position:absolute;top:14px;right:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .curso-card.selected .check-circle{background:var(--utp-blue);border-color:var(--utp-blue);color:#fff;}
    .curso-code{font-size:.72rem;font-weight:700;color:var(--utp-blue);letter-spacing:.05em;}
    .curso-name{font-size:.92rem;font-weight:600;color:var(--utp-navy);margin:4px 0;}
    .curso-meta{font-size:.78rem;color:var(--utp-gray);}
    .prereq-alert{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:.82rem;color:#DC2626;display:flex;align-items:center;gap:8px;}
    .prereq-ok{background:#ECFDF5;border:1px solid #A7F3D0;border-radius:8px;padding:10px 14px;font-size:.82rem;color:#059669;display:flex;align-items:center;gap:8px;}
</style>

<div class="app-layout">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div class="main-content">
        <div class="topbar">
            <div><div class="topbar-title">Proceso de Matrícula</div><div class="topbar-sub">Período <span th:text="${periodoActual}">2026-I</span></div></div>
            <span class="badge-period" style="background:#ECFDF5;color:#059669;border-color:#A7F3D0;"><i class="bi bi-circle-fill me-1" style="font-size:.5rem;"></i>Período activo</span>
        </div>
        <div class="page">
            
            <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
            <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

            <div class="row g-4">
                <div class="col-md-8">
                    <div class="prereq-ok mb-3"><i class="bi bi-check-circle-fill"></i> <span>Prerrequisitos verificados automáticamente. Los cursos bloqueados requieren cursos aún no aprobados.</span></div>
                    
                    <form th:action="@{/matricula}" method="post" id="formMatricula">
                        <input type="hidden" name="periodo" th:value="${periodoActual}"/>
                        <div class="card-utp mb-3">
                            <div class="card-header-utp"><h5>Cursos disponibles</h5></div>
                            <div class="card-body-utp">
                                <div class="row g-3" id="cursos-grid">
                                    <div class="col-md-6" th:each="item : ${cursosMatricula}">
                                        <div class="curso-card" th:classappend="${item.matriculado} ? 'selected' : ''" th:id="'card-' + ${item.curso.id}">
                                            
                                            <input type="checkbox" name="horariosIds" 
                                                   th:id="'check-' + ${item.curso.id}"
                                                   th:value="${item.matriculado ? item.horarioMatriculadoId : item.horarios[0].id}" 
                                                   th:checked="${item.matriculado}"
                                                   th:data-creditos="${item.curso.creditos}" 
                                                   style="display:none;" 
                                                   onchange="toggleSelection(this)"/>
                                            
                                            <div class="check-circle" th:onclick="'clickCard(' + ${item.curso.id} + ')'">
                                                <i class="bi bi-check" style="font-size:.8rem;"></i>
                                            </div>
                                            
                                            <div th:onclick="'clickCard(' + ${item.curso.id} + ')'" style="cursor:pointer; padding-right: 25px;">
                                                <div class="curso-code" th:text="${item.curso.codigo}">COD</div>
                                                <div class="curso-name" th:text="${item.curso.nombre}">Nombre del Curso</div>
                                                <div class="curso-meta"><i class="bi bi-clock me-1"></i><span th:text="${item.curso.creditos}"></span> créditos</div>
                                            </div>
                                            
                                            <div th:if="${item.matriculado}" class="mt-2 mb-1">
                                                <span class="badge bg-success text-white" style="font-size: 0.7rem; font-weight: 600; padding: 4px 8px; border-radius: 6px;">
                                                    <i class="bi bi-check-circle-fill me-1"></i>Matriculado
                                                </span>
                                            </div>
                                            
                                            <div class="mt-2">
                                                <label class="form-label" style="font-size: 0.75rem; color: var(--utp-gray); font-weight: 600; margin-bottom: 2px;">
                                                    Horario seleccionado:
                                                </label>
                                                <select class="form-select form-select-sm" style="font-size:0.78rem; border-radius: 6px;" 
                                                        th:id="'select-' + ${item.curso.id}"
                                                        onchange="changeHorario(this)">
                                                    <option th:each="h : ${item.horarios}" 
                                                            th:value="${h.id}" 
                                                            th:text="${h.dia} + ' ' + ${h.horas} + ' (' + ${h.aula} + ') - Prof: ' + ${h.docente.usuario.nombres}"
                                                            th:selected="${item.matriculado && item.horarioMatriculadoId == h.id}">
                                                        Lunes 08:00-10:00 (A-101)
                                                    </option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="col-md-4">
                    <div class="card-utp" style="position:sticky;top:0;">
                        <div class="card-header-utp"><h5><i class="bi bi-cart3 me-2" style="color:var(--utp-blue);"></i>Resumen de Matrícula</h5></div>
                        <div class="card-body-utp">
                            <div id="resumen-cursos">
                                <!-- JS llenará esto -->
                            </div>
                            <div style="background:var(--utp-light);border-radius:8px;padding:12px;margin:14px 0;">
                                <div style="display:flex;justify-content:space-between;font-size:.85rem;"><span style="color:var(--utp-gray);">Cursos seleccionados</span><strong id="num-cursos">0</strong></div>
                                <div style="display:flex;justify-content:space-between;font-size:.85rem;margin-top:6px;"><span style="color:var(--utp-gray);">Total créditos</span><strong id="total-cred">0</strong></div>
                            </div>
                            <button class="btn-primary-utp" style="width:100%;justify-content:center;" onclick="document.getElementById('formMatricula').submit();"><i class="bi bi-check2-circle"></i> Guardar Matrícula</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function clickCard(cursoId) {
    const cb = document.getElementById('check-' + cursoId);
    cb.checked = !cb.checked;
    toggleSelection(cb);
}

function toggleSelection(checkbox) {
    const cursoId = checkbox.id.replace('check-', '');
    const card = document.getElementById('card-' + cursoId);
    if (checkbox.checked) {
        card.classList.add('selected');
        validarHorario(checkbox);
    } else {
        card.classList.remove('selected');
        updateSummary();
    }
}

function changeHorario(selectElement) {
    const cursoId = selectElement.id.replace('select-', '');
    const cb = document.getElementById('check-' + cursoId);
    cb.value = selectElement.value;
    if (cb.checked) {
        validarHorario(cb);
    }
}

function updateSummary() {
    const checkboxes = document.querySelectorAll('input[name="horariosIds"]:checked');
    document.getElementById('num-cursos').innerText = checkboxes.length;
    let totalCred = 0;
    checkboxes.forEach(cb => {
        totalCred += parseInt(cb.getAttribute('data-creditos') || 0);
    });
    document.getElementById('total-cred').innerText = totalCred;
}

function validarHorario(checkbox) {
    if (!checkbox.checked) {
        updateSummary();
        return;
    }
    const horarioId = checkbox.value;
    fetch(`/matricula/validar?horarioId=${horarioId}`)
        .then(response => response.json())
        .then(data => {
            if (!data.ok) {
                alert(data.motivo);
                checkbox.checked = false;
                const cursoId = checkbox.id.replace('check-', '');
                document.getElementById('card-' + cursoId).classList.remove('selected');
            }
            updateSummary();
        })
        .catch(err => {
            console.error(err);
            updateSummary();
        });
}

// Initial summary update on page load
document.addEventListener('DOMContentLoaded', function() {
    updateSummary();
});
</script>

</body>
</html>
