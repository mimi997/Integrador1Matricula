<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error Interno')}"></head>
<body style="background-color: var(--utp-light);">

<div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;">
    <h1 style="font-size: 6rem; color: #D97706; font-weight: 800; font-family: 'Sora', sans-serif;">500</h1>
    <h3 style="color: var(--utp-dark); margin-bottom: 20px;">Ocurrió un Problema</h3>
    <p style="color: var(--utp-gray); max-width: 400px; margin-bottom: 30px;" th:text="${error != null ? error : 'Ha ocurrido un error inesperado en el servidor. Por favor intenta más tarde o contacta a soporte.'}"></p>
    <a th:href="@{/}" class="btn-primary-utp" style="text-decoration: none;"><i class="bi bi-house"></i> Volver al Inicio</a>
</div>

</body>
</html>
