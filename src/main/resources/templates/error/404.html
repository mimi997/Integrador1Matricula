<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Página No Encontrada')}"></head>
<body style="background-color: var(--utp-light);">

<div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;">
    <h1 style="font-size: 6rem; color: var(--utp-navy); font-weight: 800; font-family: 'Sora', sans-serif;">404</h1>
    <h3 style="color: var(--utp-dark); margin-bottom: 20px;">Página no encontrada</h3>
    <p style="color: var(--utp-gray); max-width: 400px; margin-bottom: 30px;" th:text="${error != null ? error : 'Lo sentimos, la página que estás buscando no existe o ha sido movida.'}"></p>
    <a th:href="@{/}" class="btn-primary-utp" style="text-decoration: none;"><i class="bi bi-house"></i> Volver al Inicio</a>
</div>

</body>
</html>
